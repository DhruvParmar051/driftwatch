# It needs no frozen record: it is a reference, never replayed as a fault.
# v1.1: R2, the second reference round of the `rounds` design - calib questions
# only, seeds no other round uses (paired_study.yaml v1.1.0).
version: "1.1.0"
data_dir: api/reference
requires_freeze: false
rounds:
  R:
    deployment: flash_0731_fp8
    round_id: ar01
    questions: reference
    seeds: f7
  R2:
    deployment: flash_0731_fp8
    round_id: ar02
    questions: calib
    seeds: r2
