[project]
name = "driftwatch"
version = "0.1.0"
description = "Label-free detection of silent quality degradation in deployed language models."
requires-python = "==3.11.*"
dependencies = [
    "httpx>=0.28",
    "pandas>=2.2",
    "pyarrow>=17",
    "numpy>=2.0",
    "scipy>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "typer>=0.12",
    "structlog>=24.4",
    "jsonschema>=4.23",
    "pyyaml>=6.0",
    "datasets>=3.0",
]

# ---------------------------------------------------------------------------
# C7 - NO LOCAL MODEL INFERENCE.
#
# The following packages are FORBIDDEN in this project and must never appear
# in `dependencies` or in any dev/optional group:
#
#     torch, transformers, sentence-transformers, accelerate, onnxruntime,
#     and anything CUDA-adjacent.
#
# Embeddings come from the `embedding` role served by the SAME batch endpoint
# (see driftwatch/config/models.yaml). This is enforced mechanically by
# tests/test_no_local_models.py, which fails the build on violation.
#
# NOTE: a HuggingFace cache containing bge / all-MiniLM-L6-v2 may already be
# present on developer machines. Do not reach for it. The platform serves
# embeddings; a local fallback is a C7 violation, not a convenience.
# ---------------------------------------------------------------------------

[project.scripts]
driftwatch = "cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Flat src layout: every top-level module and package lives directly under
# src/, so src/ is mapped to the wheel root rather than shipped as one package.
sources = ["src"]
only-include = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "gate: architectural gate test - MUST pass from day one, before any implementation",
    "spec: behavioural specification - expected to fail with NotImplementedError until implemented",
    "network: touches the real batch endpoint - never run in CI",
]


# ---------------------------------------------------------------------------
# Style is ENFORCED, not documented. Four people writing with four different
# assistants will produce four house styles unless a tool says otherwise.
# `uv run ruff check .` and `uv run ruff format --check .` run in CI and must
# pass on every commit, whoever - or whatever - wrote the code.
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes - unused imports/variables
    "I",         # isort - deterministic import order
    "UP",        # pyupgrade - modern syntax
    "B",         # bugbear - real bug patterns
    "ANN",       # flake8-annotations - typed signatures throughout
    "D",         # pydocstyle - every public function documented
    "BLE",       # blind-except - NO bare `except:`
    "T20",       # no print() - use log.get_logger()
    "RET",       # consistent returns
    "SIM",       # simplification
    "PTH",       # prefer pathlib over os.path
    "TID252",    # no relative imports - absolute only
]
ignore = [
    "ANN101", "ANN102",  # self/cls need no annotation
    "ANN401",            # Any is occasionally correct
    "D203", "D213",      # conflicting docstring rules; we use D211/D212
    "E501",              # line length handled by the formatter
    "D107",              # __init__ is documented on the class
    "D401",              # imperative-mood pedantry
    "D417",              # docstrings document the params that matter, not all of them
    "D400",              # a summary line may legitimately end in "?"
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D103", "ANN001", "ANN201", "D100", "D205"]  # test bodies need no annotations
"src/cli.py" = ["B008"]  # typer.Option() in a default IS the typer idiom
"src/*/__init__.py" = ["D104"]

[tool.ruff.lint.isort]
known-first-party = ["cli", "corpus", "detect", "evaluate", "log", "oracle",
                     "parallel", "provider", "settings", "signals", "synthetic", "textnorm", "version"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
