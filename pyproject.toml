[project]
name = "driftwatch"
version = "0.1.0"
description = "Label-free detection of silent quality degradation in deployed language models."
requires-python = "==3.11.*"
dependencies = [
    "httpx>=0.28",
    "pandas>=2.2",
    "pyarrow>=17",
    "numpy>=2.0",
    "scipy>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "typer>=0.12",
    "structlog>=24.4",
    "jsonschema>=4.23",
    "pyyaml>=6.0",
    "datasets>=3.0",
]

# ---------------------------------------------------------------------------
# C7 - NO LOCAL MODEL INFERENCE.
#
# The following packages are FORBIDDEN in this project and must never appear
# in `dependencies` or in any dev/optional group:
#
#     torch, transformers, sentence-transformers, accelerate, onnxruntime,
#     and anything CUDA-adjacent.
#
# Embeddings come from the `embedding` role served by the SAME batch endpoint
# (see driftwatch/config/models.yaml). This is enforced mechanically by
# tests/test_no_local_models.py, which fails the build on violation.
#
# NOTE: a HuggingFace cache containing bge / all-MiniLM-L6-v2 may already be
# present on developer machines. Do not reach for it. The platform serves
# embeddings; a local fallback is a C7 violation, not a convenience.
# ---------------------------------------------------------------------------

[project.scripts]
driftwatch = "driftwatch.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["driftwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "gate: architectural gate test - MUST pass from day one, before any implementation",
    "spec: behavioural specification - expected to fail with NotImplementedError until implemented",
    "network: touches the real batch endpoint - never run in CI",
]
